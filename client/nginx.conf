server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # docker internal DNS — nginx не падает, если hub ещё не поднялся
    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA-роутинг expo-router: без 301 на '/dir/', всё через index.html
    location / {
        try_files $uri $uri.html /index.html?r=$request_uri;
    }

    location /api/ {
        set $hub http://hub:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    location /ws {
        set $hub http://hub:8080;
        proxy_pass $hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Фрагменты объектов на узлах: на HTTPS-странице браузер не даст
    # обращаться к http://IP:909x, поэтому проксируем same-origin.
    location ~ ^/node/(909[0-9])/(.*)$ {
        proxy_pass http://150.251.143.212:$1/$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
    }
}
