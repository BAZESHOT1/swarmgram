# ============================================================
#  Главный сервер SwarmGram (Hub) + PostgreSQL + Web-клиент
#  Запуск:  docker compose -f docker-compose.hub.yml up -d --build
# ============================================================
services:

  postgres:
    image: postgres:17-alpine
    container_name: swarmgram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swarm}
      POSTGRES_DB: ${POSTGRES_DB:-swarm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swarm}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [swarm]
    # Ограничение по памяти: сервер слабый
    deploy:
      resources:
        limits:
          memory: 220M

  hub:
    build:
      context: ./services/hub
      dockerfile: Dockerfile
    image: swarmgram/hub:1.0.0
    container_name: swarmgram-hub
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-swarm}:${POSTGRES_PASSWORD:-swarm}@postgres:5432/${POSTGRES_DB:-swarm}
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-http://150.251.143.212:8080}
      HUB_JWT_SECRET: ${HUB_JWT_SECRET}
      HUB_ADMIN_TOKEN: ${HUB_ADMIN_TOKEN}
      # КРИТИЧНО: этим ключом зашифрованы ключи всех server-чатов.
      # Не менять без ротации и бэкапа, иначе история станет нечитаемой.
      HUB_KEY_SECRET: ${HUB_KEY_SECRET}
      HUB_KEY_SECRET_OLD: ${HUB_KEY_SECRET_OLD:-}
      HUB_REPLICAS: ${HUB_REPLICAS:-3}
      HUB_MAX_UPLOAD_MB: ${HUB_MAX_UPLOAD_MB:-25}
      HUB_ALLOW_OPEN_NODES: ${HUB_ALLOW_OPEN_NODES:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-SwarmGram <noreply@swarmgram.local>}
      SQL_DIR: /app/sql
      TMP_DIR: /tmp/swarm
      FIRMWARE_BUILDER_URL: http://firmware-builder:8090
    volumes:
      - hubtmp:/tmp/swarm
    ports:
      - "8080:8080"
    networks: [swarm]
    deploy:
      resources:
        limits:
          memory: 220M

  # ---------------------------------------------------------------
  #  Сборщик прошивок ESP32 (arduino-cli) — НЕ стартует по умолчанию.
  #  Первый запуск ставит ядро ESP32 в том (~1.5–2 ГБ), поэтому на
  #  слабом/маленьком сервере включайте его явно:
  #    docker compose -f docker-compose.hub.yml --profile firmware up -d firmware-builder
  #  Без него Hub отвечает понятной ошибкой, а .bin можно собрать локально.
  # ---------------------------------------------------------------
  firmware-builder:
    profiles: ["firmware"]
    build: ./services/firmware-builder
    container_name: swarmgram-firmware
    restart: unless-stopped
    environment:
      - PORT=8090
      - DATA_DIR=/data
      # Стабильная и более компактная версия ядра (3.x заметно больше).
      - ESP32_CORE_VERSION=${ESP32_CORE_VERSION:-3.3.12}
      # Платы через запятую. Полный набор тулчейнов не влезает на малый диск:
      # по умолчанию ставим только C3; добавьте esp32,esp32s3 при наличии места.
      - ESP32_BOARDS=${ESP32_BOARDS:-esp32c3,esp32,esp32s3}
      # Минимум свободного места для установки ядра (C3-only ~1.5–2 ГБ).
      - MIN_FREE_MB=${MIN_FREE_MB:-2200}
    volumes:
      - firmware_data:/data
    networks: [swarm]

  web:
    image: nginx:alpine
    container_name: swarmgram-web
    restart: unless-stopped
    depends_on: [hub]
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "3000:80"
      # HTTPS нужен для Web Serial (прошивка из браузера) и безопасного контекста.
      - "3443:443"
    networks: [swarm]

volumes:
  pgdata:
  hubtmp:
  firmware_data:

networks:
  swarm:
    driver: bridge
