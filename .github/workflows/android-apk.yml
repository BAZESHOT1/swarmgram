name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon -x lint
        working-directory: client/android
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1

      - name: Collect APK
        run: |
          mkdir -p ../artifacts
          cp android/app/build/outputs/apk/release/*.apk ../artifacts/Klinto-android.apk
          cd ../artifacts
          sha256sum Klinto-android.apk > Klinto-android.apk.sha256
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: Klinto-android-apk
          path: artifacts/

      - name: Release APK
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Klinto Android build ${{ github.run_number }}
          files: artifacts/*
          generate_release_notes: true
