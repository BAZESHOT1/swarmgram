name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon -x lint
        working-directory: client/android
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Sign release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p ../artifacts
          APK="$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/klinto.keystore"
            BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/klinto.keystore" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out ../artifacts/Klinto-android.apk \
              "$APK"
            "$BUILD_TOOLS/apksigner" verify --verbose ../artifacts/Klinto-android.apk | tail -n 5
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 не задан — APK останется неподписанным"
            cp "$APK" ../artifacts/Klinto-android.apk
          fi

      - name: Collect APK checksum
        run: |
          cd ../artifacts
          sha256sum Klinto-android.apk > Klinto-android.apk.sha256
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: Klinto-android-apk
          path: artifacts/

      - name: Release APK
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Klinto Android build ${{ github.run_number }}
          files: artifacts/*
          generate_release_notes: true
