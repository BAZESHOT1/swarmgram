# ============================================================
#  Узел хранения SwarmGram (ставится на сервер пользователя)
#  Запуск:  docker compose -f docker-compose.node.yml up -d --build
#  Перед запуском заполнить .env (см. node.env.example)
# ============================================================
services:

  node:
    build:
      context: ./services/node
      dockerfile: Dockerfile
    image: swarmgram/node:1.0.0
    container_name: swarmgram-node
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_PORT: "9090"
      NODE_DATA_DIR: /data
    volumes:
      - nodedata:/data
    ports:
      - "${NODE_PORT_HOST:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 160M

volumes:
  nodedata:
